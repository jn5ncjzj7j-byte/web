<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ชำระค่า Netflix</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #141414; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #000; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 380px; border: 1px solid #333; text-align: center; }
        h2 { color: #E50914; font-size: 28px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 10px; color: #aaa; font-size: 14px; }
        select { width: 100%; padding: 12px; border-radius: 8px; background: #2f2f2f; color: white; border: 1px solid #444; font-size: 16px; margin-bottom: 25px; outline: none; cursor: pointer; }
        .info-box { background: #1f1f1f; padding: 20px; border-radius: 10px; display: none; transition: all 0.3s ease; }
        .row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 15px; }
        .total-row { border-top: 1px solid #444; margin-top: 15px; padding-top: 15px; }
        .total-price { font-size: 24px; color: #E50914; font-weight: bold; }
        .btn-pay { display: block; background: #E50914; color: white; text-decoration: none; padding: 14px; border-radius: 8px; margin-top: 25px; font-weight: bold; transition: 0.2s; }
        .btn-pay:hover { background: #b20710; transform: scale(1.02); }
        .loader { color: #888; font-size: 13px; }
    </style>
</head>
<body>

<div class="card">
    <h2>NETFLIX</h2>
    <p style="margin-bottom: 20px; font-size: 14px;">กรุณาเลือกชื่อเพื่อตรวจสอบยอดชำระ</p>
    
    <label for="nameSelect">รายชื่อสมาชิก</label>
    <select id="nameSelect" onchange="fetchDetails(this.value)">
        <option value="">-- กำลังโหลดรายชื่อ... --</option>
    </select>

    <div id="resultBox" class="info-box">
        <div class="row">
            <span>ค่าบริการเดือนนี้:</span>
            <span><span id="amt">0</span> บาท</span>
        </div>
        <div class="row">
            <span>ยอดค้างชำระเดิม:</span>
            <span><span id="bal">0</span> บาท</span>
        </div>
        <div class="row total-row">
            <span>ยอดรวมที่ต้องโอน:</span>
            <span class="total-price" id="total">0.00 บาท</span>
        </div>
        
        <a href="https://tmn.app.link/Y5OprkLlj0b" class="btn-pay">โอนผ่าน TrueMoney Wallet</a>
    </div>
    
    <div id="loadingText" class="loader" style="display:none;">กำลังดึงข้อมูลยอดเงิน...</div>
</div>

<script>
    // URL ที่คุณ Deploy มา
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby9tAfpxFCH4AcSyX7MHQPR4BkNrf-QqohRgncgpWg3/exec';

    // 1. ดึงรายชื่อทั้งหมดเมื่อเปิดหน้าเว็บ
    window.onload = async () => {
        try {
            const response = await fetch(SCRIPT_URL);
            const names = await response.json();
            const select = document.getElementById('nameSelect');
            select.innerHTML = '<option value="">-- เลือกชื่อของคุณ --</option>';
            names.forEach(name => {
                let opt = document.createElement('option');
                opt.value = name;
                opt.innerHTML = name;
                select.appendChild(opt);
            });
        } catch (e) {
            alert('ไม่สามารถโหลดรายชื่อได้ โปรดเช็คการตั้งค่า Permission ใน Apps Script');
        }
    };

    // 2. ดึงยอดเงินเมื่อเลือกชื่อ
    async function fetchDetails(name) {
        const resultBox = document.getElementById('resultBox');
        const loadingText = document.getElementById('loadingText');

        if (!name) {
            resultBox.style.display = 'none';
            return;
        }

        resultBox.style.display = 'none';
        loadingText.style.display = 'block';
        
        try {
            const response = await fetch(`${SCRIPT_URL}?name=${encodeURIComponent(name)}`);
            const data = await response.json();
            
            document.getElementById('amt').innerText = data.amount;
            document.getElementById('bal').innerText = data.balance;
            document.getElementById('total').innerText = (parseFloat(data.amount) + parseFloat(data.balance)).toFixed(2) + ' บาท';
            
            loadingText.style.display = 'none';
            resultBox.style.display = 'block';
        } catch (e) {
            loadingText.style.display = 'none';
            alert('เกิดข้อผิดพลาดในการดึงข้อมูล');
        }
    }
</script>

</body>
</html>
